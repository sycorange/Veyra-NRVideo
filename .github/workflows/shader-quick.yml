name: Shader quick build (fork test helper)

# Fork-only helper, not for upstream: compiles the experimental repair shader alone, with
# the same dxc and flags as cmake/VeyraShaders.cmake, so its thresholds can be tuned
# without a full application build.

on:
  workflow_dispatch:
  push:
    paths:
      - 'shaders/FgStaticRepair.hlsl'
      - 'shaders/FgPairChange.hlsl'
      - '.github/workflows/shader-quick.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Compile the experimental repair shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { throw 'dxc.exe not found under the Windows Kits' }
          Write-Host "dxc: $($dxc.FullName)"
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($name in 'FgStaticRepair', 'FgPairChange') {
            & $dxc.FullName -T cs_6_0 -E main -O3 -Qstrip_debug -Qstrip_reflect -Fo "out\$name.dxil" "shaders\$name.hlsl"
            if ($LASTEXITCODE -ne 0) { throw "dxc failed on $name with exit code $LASTEXITCODE" }
            Get-FileHash "out\$name.dxil" -Algorithm SHA256 | Format-List
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veyra-repair-shader
          path: out
          if-no-files-found: error
